<!--
  The configurator's browser test.

  This is the real interface: the theme's real stylesheet, the theme's real
  four modules, and the markup footer.php renders. The only thing that is
  faked is the network — the fetch stub answers the theme's own REST routes,
  so the transport, the models, the view and the wiring are all exercised
  as they run in a browser.

  The results are written into the document title as JSON, which is what
  tests/configurator-browser-test.js reads back. The runner passes
  --force-prefers-reduced-motion: the panel slides in with a CSS transition,
  and a headless browser whose virtual clock does not advance animations
  would measure the panel while it is still off screen.
-->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../configurator/configurator.css">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#f6f6f7}</style>
</head><body>
<div id="agentshell-config-panel" class="as-cfg" aria-hidden="false"></div>
<button id="agentshell-config-trigger" aria-label="Open theme configurator">cfg</button>
<script>
var SCENARIO = ( new URLSearchParams( location.search ).get( 'scenario' ) || 'default' );
window.__errors = [];
window.onerror = function (m, s, l, c) { window.__errors.push(m + ' @' + l + ':' + c); };
window.__requests = [];
window.__opened = [];
window.__puts = [];

const ZONE_RESPONSE = {
  config: { '--theme-bg': '#fafaf9', '--theme-text': '#1f2937', '--theme-accent': '#e87a3e',
            '--theme-header-bg': '#ffffff', '--zone-header-layout': 'space-between', '--spacing-base': '1rem',
            // A stored custom shadow: not one of the presets, so the editor
            // must select "Custom" and leave the value alone.
            '--theme-shadow': '0 2px 4px rgba(0,0,0,0.12)' },
  defaults: {}, custom_css: '/* agent-set rule */', custom_js: '',
  zones: [
    { id: 'header', label: 'Header', slots: {
        'top-left': [], 'top-center': [], 'top-right': [{ type: 'wp_core', id: 'nav_menu', menu: 'utility', mode: 'horizontal', label: 'Utility' }],
        'middle-left': [{ type: 'wp_core', id: 'site_logo' }], 'middle-center': [{ type: 'wp_core', id: 'nav_menu' }],
        'middle-right': [{ type: 'wp_core', id: 'search_form' }],
        'bottom-left': [], 'bottom-center': [], 'bottom-right': []
      } },
    { id: 'main', label: 'Main', composition: [{ type: 'wp_loop' }] },
    { id: 'footer', label: 'Footer', slots: {
        'top-left': [{ type: 'wp_core', id: 'nav_menu', menu: 'legal', mode: 'vertical' }], 'top-center': [], 'top-right': [],
        'middle-left': [], 'middle-center': [], 'middle-right': [],
        'bottom-left': [], 'bottom-center': [], 'bottom-right': []
      } }
  ],
  zone_areas: [
    {id:'top-left',row:'top',column:0,label:'Top Left',short:'TL'},{id:'top-center',row:'top',column:1,label:'Top Centre',short:'TC'},
    {id:'top-right',row:'top',column:2,label:'Top Right',short:'TR'},{id:'middle-left',row:'middle',column:0,label:'Middle Left',short:'ML'},
    {id:'middle-center',row:'middle',column:1,label:'Middle Centre',short:'MC'},{id:'middle-right',row:'middle',column:2,label:'Middle Right',short:'MR'},
    {id:'bottom-left',row:'bottom',column:0,label:'Bottom Left',short:'BL'},{id:'bottom-center',row:'bottom',column:1,label:'Bottom Centre',short:'BC'},
    {id:'bottom-right',row:'bottom',column:2,label:'Bottom Right',short:'BR'}
  ],
  zone_align: { slot: ['start','center','end','stretch'], row: ['start','center','end'], rows: ['top','middle','bottom'] },
  available_menus: [ {id:11,slug:'primary',name:'Main Menu',count:3}, {id:12,slug:'utility',name:'Utility',count:2}, {id:14,slug:'legal',name:'Legal',count:2} ],
  available_menu_locations: [ {slug:'primary',label:'Primary',menu_id:11} ],
  available_widgets: [ {id:'chart',name:'Chart',source:'file',status:'active'} ],
  available_widget_areas: [ {id:'primary-sidebar',name:'Primary Sidebar'} ],
  core_components: [ {id:'site_title',name:'Site Title'},{id:'site_logo',name:'Site Logo'},{id:'nav_menu',name:'Primary Navigation Menu'},{id:'search_form',name:'Search Form'} ],
  navigation_dependencies: { menus: [ {reference:'utility',kind:'menu'}, {reference:'legal',kind:'menu'} ], locations: [] }
};

window.AgentShellConfig = { restUrl: '/', nonce: 'x', adminUrl: '/admin-ajax.php' };

// A small stateful server, so the browser test exercises the real workflow:
// a PUT inside a transaction stages, a commit promotes, a rollback discards.
window.__opened = [];
window.__openCalls = [];
window.open = function (url) {
  window.__openCalls.push({ url: url, at: window.__requests.length });
  if (SCENARIO === 'blocked') { return null; }
  var win = {
    closed: false,
    opener: null,
    url: '',
    close: function () { win.closed = true; },
    location: {
      replace: function (next) { win.url = next; window.__opened.push(next); },
    },
  };
  if (url && url !== 'about:blank') {
    win.url = url;
    window.__opened.push(url);
  }
  return win;
};
window.confirm = function () { return true; };

function respond(data, ok, status) {
  return { ok: ok !== false, status: status || 200,
           text: function () { return Promise.resolve(JSON.stringify(data)); } };
}

function clone(value) { return JSON.parse(JSON.stringify(value)); }

function payload_from_response(response) {
  var payload = {};
  Object.keys(response.config || {}).forEach(function (key) {
    if (key.indexOf('--') === 0) { payload[key] = response.config[key]; }
  });
  payload.custom_css = response.custom_css || '';
  payload.custom_js = response.custom_js || '';
  payload.zones = clone(response.zones || []);
  return payload;
}

function response_from_payload(payload) {
  var response = clone(ZONE_RESPONSE);
  response.config = {};
  Object.keys(payload || {}).forEach(function (key) {
    if (key.indexOf('--') === 0 && typeof payload[key] === 'string') {
      response.config[key] = payload[key];
    }
  });
  response.custom_css = payload.custom_css || '';
  response.custom_js = payload.custom_js || '';
  response.zones = clone(payload.zones || []);
  return response;
}

var SERVER = {
  committed: clone(ZONE_RESPONSE),
  staged: null,
  tx: null,
  previews: 0,
  outcomes: {},
  next_session: 0,
  history: {
    snapshots: [
      { name: 'launch-day', label: 'Launch day', actor: 'admin', timestamp: 1767225600, type: 'snapshot' },
      { name: 'before-header', label: 'Before the header change', actor: 'admin', timestamp: 1767139200, type: 'snapshot' }
    ],
    revisions: [
      { id: 'r3', label: 'Updated accent colour', description: 'Updated accent colour', actor: 'admin', timestamp: 1767312000, type: 'revision' },
      { id: 'r2', label: 'Changed footer layout', description: 'Changed footer layout', actor: 'editor', timestamp: 1767225600, type: 'revision' },
      { id: 'r1', label: 'config_update', description: 'Updated custom CSS', actor: 'agent', timestamp: 1767139200, type: 'revision' }
    ],
    audit: []
  },
};

// Fixtures that model the conditions the client must survive.
if (SCENARIO === 'locked') {
  // A different account: unrecoverable from here.
  SERVER.tx = { id: 'tx-agent', actor: 'agent', label: 'agent work', session: null };
}
if (SCENARIO === 'refusal') {
  // This tab's own earlier preview (its token is seeded into sessionStorage).
  SERVER.tx = { id: 'tx-mine', actor: 'me', label: 'earlier work', session: 'tab-token-0' };
  SERVER.staged = payload_from_response(SERVER.committed);
}
if (SCENARIO === 'session') {
  // The same account, another browser session. This tab has no capability.
  SERVER.tx = { id: 'tx-other-tab', actor: 'me', label: 'other tab preview', session: 'other-tab-token' };
  SERVER.staged = payload_from_response(SERVER.committed);
}
if (SCENARIO === 'unbound') {
  // An agent (or an older editor) opened it; no browser session owns it.
  SERVER.tx = { id: 'tx-unbound', actor: 'me', label: 'agent work', session: null };
  SERVER.staged = payload_from_response(SERVER.committed);
}

function header_session(opts) {
  var headers = (opts && opts.headers) || {};
  return headers['X-AgentShell-Editor-Session'] || null;
}

function owns_tx(opts) {
  return !!(SERVER.tx && SERVER.tx.session && SERVER.tx.session === header_session(opts));
}

function apply_commit() {
  if (SERVER.staged) {
    SERVER.committed = response_from_payload(SERVER.staged);
  }
  if (SERVER.tx) {
    SERVER.outcomes[SERVER.tx.id] = 'committed';
  }
  SERVER.tx = null;
  SERVER.staged = null;
}

function transaction_response(opts) {
  if (!SERVER.tx) {
    return { open: false, id: null, actor: null, label: null, owned_by_us: false,
             owned_by_session: false, editable_by_us: false, session_bound: false,
             started_at: null, has_staged: false, stale: false, can_take_over: false,
             lock_reason: 'none' };
  }
  var actor_match = SERVER.tx.actor === 'me';
  var bound = !!SERVER.tx.session;
  var mine = actor_match && bound && owns_tx(opts);
  var reason = mine ? '' : (!actor_match ? 'other_actor' : (bound ? 'other_session' : 'unbound'));
  var response = {
    open: true,
    id: SERVER.tx.id,
    actor: SERVER.tx.actor,
    label: SERVER.tx.label || '',
    owned_by_us: actor_match,
    owned_by_session: mine,
    editable_by_us: mine,
    session_bound: bound,
    started_at: 1,
    has_staged: !!SERVER.staged,
    stale: false,
    can_take_over: !mine && actor_match,
    lock_reason: reason,
    expires_at: 9999999999,
    seconds_remaining: 3600,
  };
  if (mine && SERVER.staged) {
    response.staged = response_from_payload(SERVER.staged);
  }
  return response;
}

window.fetch = function (url, opts) {
  var path = String(url);
  var method = (opts && opts.method) || 'GET';
  var body = opts && opts.body ? JSON.parse(opts.body) : null;
  window.__requests.push(method + ' ' + path);

  // ── transaction outcome ─────────────────────────────────────────────
  if (path.indexOf('/transaction/outcome') !== -1) {
    var id = decodeURIComponent(path.split('id=')[1] || '');
    if (SERVER.tx && SERVER.tx.id === id) {
      return Promise.resolve(respond({
        id: id,
        state: 'open',
        has_staged: !!SERVER.staged,
        owned_by_us: SERVER.tx.actor === 'me',
        owned_by_session: owns_tx(opts),
      }));
    }
    if (SERVER.outcomes[id]) {
      return Promise.resolve(respond({ id: id, state: SERVER.outcomes[id] }));
    }
    return Promise.resolve(respond({ id: id, state: 'unknown', reason: 'no_evidence' }));
  }

  // ── transaction recovery ────────────────────────────────────────────
  if (path.indexOf('/transaction/recover') !== -1) {
    if (!SERVER.tx) {
      return Promise.resolve(respond({ code: 'transaction_recovery_failed', message: 'No transaction is open.' }, false, 409));
    }
    if (SERVER.tx.actor !== 'me') {
      return Promise.resolve(respond({ code: 'transaction_recovery_failed', message: 'Only the opening account may recover it.' }, false, 409));
    }
    if (body && body.confirm !== true) {
      return Promise.resolve(respond({ code: 'transaction_recovery_unconfirmed', message: 'confirm is required.' }, false, 400));
    }
    SERVER.next_session += 1;
    SERVER.tx.session = 'tab-token-' + SERVER.next_session;
    return Promise.resolve(respond({ id: SERVER.tx.id, label: SERVER.tx.label, editor_session: SERVER.tx.session, recovered: true }));
  }

  // ── preview credential ──────────────────────────────────────────────
  if (path.indexOf('/transaction/preview') !== -1) {
    if (!SERVER.tx || !owns_tx(opts)) {
      return Promise.resolve(respond({ code: 'transaction_locked_by_session', message: 'The staged work belongs to another editor session.' }, false, 409));
    }
    if (window.__fail_preview_url) {
      window.__fail_preview_url = false;
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    SERVER.previews += 1;
    return Promise.resolve(respond({ url: 'https://example.test/?agentshell_tx=' + SERVER.tx.id + '&n=' + SERVER.previews,
                                     diff: {}, summary: { added: 0, removed: 0, changed: 1 } }));
  }

  // ── commit ──────────────────────────────────────────────────────────
  if (path.indexOf('/transaction/commit') !== -1) {
    if (!SERVER.tx) {
      return Promise.resolve(respond({ code: 'transaction_commit_failed', message: 'No transaction is open.' }, false, 409));
    }
    if (!owns_tx(opts)) {
      return Promise.resolve(respond({ code: 'transaction_locked_by_session', message: 'This transaction belongs to another editor session.' }, false, 409));
    }
    if (window.__commit_fail_confirmed) {
      return Promise.resolve(respond({ code: 'transaction_commit_failed', message: 'Commit blocked by validation errors.' }, false, 409));
    }
    if (window.__commit_then_fail || window.__commit_then_fail_refresh) {
      var lose_response = window.__commit_then_fail_refresh;
      window.__commit_then_fail = false;
      window.__commit_then_fail_refresh = false;
      apply_commit();
      if (lose_response) { window.__fail_get_config_once = true; }
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    apply_commit();
    if (window.__refreshaftercommit) {
      window.__refreshaftercommit = false;
      window.__fail_get_config_once = true;
    }
    return Promise.resolve(respond({ committed: true }));
  }

  // ── begin / rollback / read ─────────────────────────────────────────
  if (path.indexOf('/transaction') !== -1 && method === 'POST') {
    if (SERVER.tx && SERVER.tx.actor !== 'me') {
      return Promise.resolve(respond({ code: 'transaction_locked_by_other', message: 'Another actor owns the open transaction.' }, false, 409));
    }
    if (SERVER.tx && !owns_tx(opts)) {
      return Promise.resolve(respond({ code: SERVER.tx.session ? 'transaction_locked_by_session' : 'transaction_requires_recovery',
        message: 'The open transaction belongs to another editor session.', can_take_over: true }, false, 409));
    }
    if (!SERVER.tx) {
      SERVER.next_session += 1;
      SERVER.tx = { id: 'tx-workflow-' + SERVER.next_session, actor: 'me', label: body && body.label,
                    session: 'tab-token-' + SERVER.next_session };
      return Promise.resolve(respond({ id: SERVER.tx.id, label: SERVER.tx.label,
                                       editor_session: SERVER.tx.session, resumed: false }));
    }
    return Promise.resolve(respond({ id: SERVER.tx.id, label: SERVER.tx.label, editor_session: null, resumed: true }));
  }
  if (path.indexOf('/transaction') !== -1 && method === 'DELETE') {
    if (!SERVER.tx) {
      return Promise.resolve(respond({ rolled_back: true }));
    }
    if (!owns_tx(opts)) {
      return Promise.resolve(respond({ code: 'transaction_rollback_failed', message: 'This transaction belongs to another editor session.' }, false, 409));
    }
    var rolled_id = SERVER.tx.id;
    if (window.__rollback_then_fail) {
      window.__rollback_then_fail = false;
      SERVER.outcomes[rolled_id] = 'rolled_back';
      SERVER.tx = null;
      SERVER.staged = null;
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    SERVER.outcomes[rolled_id] = 'rolled_back';
    SERVER.tx = null;
    SERVER.staged = null;
    return Promise.resolve(respond({ rolled_back: true }));
  }
  if (path.indexOf('/transaction') !== -1) {
    return Promise.resolve(respond(transaction_response(opts)));
  }

  // ── configuration ───────────────────────────────────────────────────
  if (path.indexOf('/config') !== -1 && method === 'PUT') {
    if (window.__fail_next_put) {
      window.__fail_next_put = false;
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    if (!SERVER.tx) {
      return Promise.resolve(respond({ code: 'config_write_failed', message: 'No transaction is open.' }, false, 409));
    }
    if (!owns_tx(opts)) {
      return Promise.resolve(respond({ code: 'transaction_locked_by_session', message: 'This configuration belongs to another editor session.' }, false, 409));
    }
    // #bad is a valid three-digit hex colour, so it is not a refusal. The
    // fixture uses a value the server's own regex refuses.
    if (body && body['--theme-bg'] === '#zzzzzz') {
      // WordPress maps a WP_Error without an explicit status onto HTTP 500,
      // which is how the canonical validator actually answers a bad colour.
      // The editor must still call this a validation refusal, not a lost
      // connection.
      return Promise.resolve(respond({ code: 'invalid_color_value', message: 'Invalid color value for background: #zzzzzz' }, false, 500));
    }
    window.__puts.push(body);
    SERVER.staged = body;
    if (window.__fail_put_after_stage) {
      window.__fail_put_after_stage = false;
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    return Promise.resolve(respond(body));
  }
  if (path.indexOf('/config') !== -1) {
    if (window.__fail_get_config_once) {
      window.__fail_get_config_once = false;
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    return Promise.resolve(respond(SERVER.committed));
  }
  if (path.indexOf('/snapshots/delete') !== -1) {
    if (window.__fail_history_delete) {
      return Promise.resolve(respond({ code: 'rest_forbidden', message: 'You are not allowed to do that.' }, false, 403));
    }
    if (window.__history_uncertain) {
      return Promise.resolve(respond({
        code: 'history_delete_unverified',
        message: 'The deletion could not be verified: the server could not establish whether the write landed.',
        data: { status: 500, data: { outcome: 'uncertain', deleted: [], missing: [], audit_state: 'none' } }
      }, false, 500));
    }
    var delete_names = (body && body.names) || [];
    var snap_deleted = [];
    var snap_missing = [];
    var force_missing = window.__history_missing_next;
    window.__history_missing_next = false;
    delete_names.forEach(function (name) {
      var index = SERVER.history.snapshots.map(function (s) { return s.name; }).indexOf(name);
      if (index === -1 || force_missing) { snap_missing.push(name); return; }
      snap_deleted.push(name);
      SERVER.history.snapshots.splice(index, 1);
    });
    if (snap_deleted.length) {
      SERVER.history.audit.push({ operation: 'snapshot_deleted', names: snap_deleted });
    }
    return Promise.resolve(respond({ outcome: snap_deleted.length ? 'deleted' : 'unchanged',
      deleted: snap_deleted, missing: snap_missing, audit_recorded: !!snap_deleted.length,
      audit_state: snap_deleted.length ? 'deleted' : 'none' }));
  }
  if (path.indexOf('/revisions/delete') !== -1) {
    if (window.__fail_history_delete) {
      return Promise.resolve(respond({ code: 'rest_forbidden', message: 'You are not allowed to do that.' }, false, 403));
    }
    if (window.__history_uncertain) {
      return Promise.resolve(respond({
        code: 'history_delete_unverified',
        message: 'The deletion could not be verified: the server could not establish whether the write landed.',
        data: { status: 500, data: { outcome: 'uncertain', deleted: [], missing: [], audit_state: 'none' } }
      }, false, 500));
    }
    var delete_ids = (body && body.ids) || [];
    var rev_deleted = [];
    var rev_missing = [];
    var force_missing_rev = window.__history_missing_next;
    window.__history_missing_next = false;
    delete_ids.forEach(function (id) {
      var index = SERVER.history.revisions.map(function (r) { return r.id; }).indexOf(id);
      if (index === -1 || force_missing_rev) { rev_missing.push(id); return; }
      rev_deleted.push(id);
      SERVER.history.revisions.splice(index, 1);
    });
    if (rev_deleted.length) {
      SERVER.history.audit.push({ operation: 'revision_deleted', ids: rev_deleted });
    }
    return Promise.resolve(respond({ outcome: rev_deleted.length ? 'deleted' : 'unchanged',
      deleted: rev_deleted, missing: rev_missing, audit_recorded: !!rev_deleted.length,
      audit_state: rev_deleted.length ? 'deleted' : 'none' }));
  }
  if (path.indexOf('/snapshots/restore') !== -1) {
    return Promise.resolve(respond({ restored: body.name }));
  }
  if (path.indexOf('/revisions/restore') !== -1) {
    return Promise.resolve(respond({ restored: body.id }));
  }
  if (path.indexOf('/snapshots') !== -1) {
    return Promise.resolve(respond({ snapshots: SERVER.history.snapshots }));
  }
  if (path.indexOf('/revisions') !== -1) {
    return Promise.resolve(respond({ revisions: SERVER.history.revisions }));
  }
  return Promise.resolve(respond({}));
};
</script>
<script src="../configurator/configurator-state.js"></script>
<script src="../configurator/configurator-api.js"></script>
<script src="../configurator/configurator-picker.js"></script>
<script src="../configurator/configurator-ui.js"></script>
<script src="../configurator/configurator-app.js"></script>
<script>
window.__results = [];
function ok(name, cond, detail) { window.__results.push({ name: name, pass: !!cond, detail: detail === undefined ? null : detail }); }
function q(sel) { return document.querySelector(sel); }
function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function byText(sel, text) { return qa(sel).filter(function (el) { return el.textContent.trim() === text; })[0]; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function chip() { var el = q('.as-cfg__status'); return el ? el.textContent.trim() : '(no chip)'; }
function areaButtons() { return qa('button.as-cfg__area'); }
function tokenInput(token) { return q('.as-cfg__input[data-token="' + token + '"]'); }

async function run() {
  // A tab that already owns a transaction carries its capability in
  // sessionStorage, exactly as the real editor does after a reload.
  if (SCENARIO === 'refusal') {
    try { sessionStorage.setItem('agentshell.editor.session.v1', 'tab-token-0'); } catch (e) {}
  }

  // The theme boots the editor from an inline script after the modules load.
  window.AgentshellConfiguratorApp.boot({ restUrl: '/', nonce: 'x' });
  document.getElementById('agentshell-config-trigger').click();
  await wait(300);

  if (SCENARIO === 'locked') {
    await run_locked();
    return;
  }
  if (SCENARIO === 'refusal') {
    await run_refusal();
    return;
  }
  if (SCENARIO === 'picker') {
    await run_picker();
    return;
  }
  if (SCENARIO === 'workflow') {
    await run_workflow();
    return;
  }
  if (SCENARIO === 'blocked') {
    await run_blocked();
    return;
  }
  if (SCENARIO === 'session' || SCENARIO === 'unbound') {
    await run_session();
    return;
  }
  if (SCENARIO === 'history') {
    await run_history();
    return;
  }
  if (SCENARIO === 'commitlost') {
    await run_commitlost(false);
    return;
  }
  if (SCENARIO === 'commitlostrefresh') {
    await run_commitlost(true);
    return;
  }
  if (SCENARIO === 'refreshaftercommit') {
    await run_refreshaftercommit();
    return;
  }
  if (SCENARIO === 'commitfail') {
    await run_commitfail();
    return;
  }
  if (SCENARIO === 'previewstagefail') {
    await run_previewstagefail();
    return;
  }
  if (SCENARIO === 'previewnetwork') {
    await run_previewnetwork();
    return;
  }
  if (SCENARIO === 'previewurlnetwork') {
    await run_previewurlnetwork();
    return;
  }

  // ── the shell ───────────────────────────────────────────────────────
  ok('the editor opens', !!q('.as-cfg__rail'));
  ok('the editor stays open after it loads', q('#agentshell-config-panel').classList.contains('is-open'),
     q('#agentshell-config-panel').className);
  ok('the dock is on screen',
     q('#agentshell-config-panel').getBoundingClientRect().right <= window.innerWidth + 1 &&
     q('#agentshell-config-panel').getBoundingClientRect().left >= 0,
     JSON.stringify(q('#agentshell-config-panel').getBoundingClientRect().toJSON()));
  ok('no JavaScript errors on open', window.__errors.length === 0, window.__errors.join('; '));
  ok('the rail lists the four contexts', qa('.as-cfg__tab').length === 4, String(qa('.as-cfg__tab').length));
  ok('the action bar is present', !!q('.as-cfg__actions'));
  ok('the save button is in the action bar', !!q('.as-cfg__actions [data-focus-key="save"]'));

/**
 * The operator workflow, end to end.
 *
 * Edit → Preview stages into a transaction and leaves it open; the public
 * configuration does not move. A later edit is restaged by the next
 * Preview. Discard rolls the staged work back. Save commits the transaction
 * the preview opened. Failures keep the draft, and a successful operation
 * clears the old error.
 */
async function run_workflow() {
  q('.as-cfg__tab[data-context="appearance"]').click();
  await wait(80);

  function set_bg(value) {
    var input = tokenInput('--theme-bg');
    input.value = value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function bg() { return tokenInput('--theme-bg').value; }

  // ── 1. Edit: dirty, nothing written ─────────────────────────────────
  set_bg('#123456');
  await wait(60);
  ok('an edit is dirty', chip() === 'Unsaved changes', chip());
  ok('an edit writes nothing', window.__puts.length === 0, String(window.__puts.length));

  // ── 2. Preview: opens the tab synchronously, then stages ────────────
  window.__requests.length = 0;
  window.__opened.length = 0;
  window.__openCalls.length = 0;
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);

  var post_index = window.__requests.indexOf('POST /wp/v2/agentshell/transaction');
  ok('preview opens a transaction', post_index !== -1, window.__requests.join(' '));
  ok('preview stages the draft through the config endpoint',
     window.__puts.length === 1 && window.__puts[0]['--theme-bg'] === '#123456',
     JSON.stringify(window.__puts));
  ok('preview asks for the signed preview URL',
     window.__requests.join(' ').indexOf('/transaction/preview') !== -1, window.__requests.join(' '));
  ok('the preview tab is opened before the first request',
     window.__openCalls.length === 1 && window.__openCalls[0].url === 'about:blank' &&
     window.__openCalls[0].at === 0 && post_index > 0,
     JSON.stringify(window.__openCalls) + ' / POST at ' + post_index);
  ok('the placeholder is navigated to the signed URL',
     window.__opened.length === 1 && window.__opened[0].indexOf('agentshell_tx') !== -1,
     JSON.stringify(window.__opened));
  ok('preview leaves the transaction open', !!SERVER.tx && SERVER.tx.actor === 'me',
     SERVER.tx ? JSON.stringify(SERVER.tx) : 'none');
  ok('preview stages exactly the draft', SERVER.staged && SERVER.staged['--theme-bg'] === '#123456',
     SERVER.staged ? SERVER.staged['--theme-bg'] : 'none');
  ok('the public configuration has not changed',
     SERVER.committed.config['--theme-bg'] === '#fafaf9', SERVER.committed.config['--theme-bg']);
  ok('the status says staged for preview, not saved', chip() === 'Staged for preview', chip());

  // ── 5. Another edit is restaged by the next preview ─────────────────
  set_bg('#654321');
  await wait(60);
  ok('an edit after a preview is "changes since preview"', chip() === 'Changes since preview', chip());
  var puts_before = window.__puts.length;
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('a second preview restages the latest draft',
     window.__puts.length === puts_before + 1 && SERVER.staged['--theme-bg'] === '#654321',
     JSON.stringify(SERVER.staged && SERVER.staged['--theme-bg']));
  ok('the second preview still does not commit',
     SERVER.committed.config['--theme-bg'] === '#fafaf9', SERVER.committed.config['--theme-bg']);
  ok('the status returns to staged', chip() === 'Staged for preview', chip());

  // A reload of the editor while the preview transaction exists restores the
  // staged draft from the server, not from a local memory of what was sent.
  await window.AgentshellConfigurator.load();
  await wait(200);
  ok('a reload restores the staged draft', bg() === '#654321', bg());
  ok('a reload still reports the committed configuration as unsaved-stage',
     SERVER.committed.config['--theme-bg'] === '#fafaf9', SERVER.committed.config['--theme-bg']);
  ok('a reload reports staged for preview', chip() === 'Staged for preview', chip());

  // ── 6. Discard: committed state unchanged, draft reverted ───────────
  var commits_before = window.__requests.filter(function (r) { return r === 'POST /wp/v2/agentshell/transaction/commit'; }).length;
  q('.as-cfg__actions [data-focus-key="discard"]').click();
  await wait(500);
  ok('discard rolls the staged transaction back',
     window.__requests.join(' ').indexOf('DELETE /wp/v2/agentshell/transaction') !== -1, window.__requests.join(' '));
  ok('discard removes the transaction', !SERVER.tx, SERVER.tx ? SERVER.tx.id : 'none');
  ok('discard leaves the committed configuration alone',
     SERVER.committed.config['--theme-bg'] === '#fafaf9', SERVER.committed.config['--theme-bg']);
  ok('discard reverts the draft', bg() === '#fafaf9', bg());
  ok('discard is Saved again', chip() === 'Saved', chip());
  ok('discard did not commit',
     window.__requests.filter(function (r) { return r === 'POST /wp/v2/agentshell/transaction/commit'; }).length === commits_before,
     window.__requests.join(' '));

  // ── 7. Edit → Preview → Save, then reload ───────────────────────────
  set_bg('#abcdef');
  await wait(60);
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('the third preview stages the new draft', SERVER.staged['--theme-bg'] === '#abcdef', SERVER.staged['--theme-bg']);
  var begins_before_save = window.__requests.filter(function (r) { return r === 'POST /wp/v2/agentshell/transaction'; }).length;
  q('.as-cfg__actions [data-focus-key="save"]').click();
  await wait(600);
  ok('save commits the preview transaction',
     window.__requests.join(' ').indexOf('/transaction/commit') !== -1, window.__requests.join(' '));
  ok('save did not begin a second transaction',
     window.__requests.filter(function (r) { return r === 'POST /wp/v2/agentshell/transaction'; }).length === begins_before_save,
     window.__requests.join(' '));
  ok('save stores the staged draft', SERVER.committed.config['--theme-bg'] === '#abcdef', SERVER.committed.config['--theme-bg']);
  ok('save reports Saved', chip() === 'Saved', chip());
  ok('save closes the transaction', !SERVER.tx, SERVER.tx ? SERVER.tx.id : 'none');

  await window.AgentshellConfigurator.load();
  await wait(150);
  ok('a reload reads the committed value back', bg() === '#abcdef', bg());
  ok('a reload is Saved', chip() === 'Saved', chip());

  // ── 8. An old error disappears after a successful operation ─────────
  set_bg('#zzzzzz');
  await wait(60);
  q('.as-cfg__actions [data-focus-key="save"]').click();
  await wait(500);
  ok('a validation failure is reported', !!q('.as-cfg__alert') &&
     q('.as-cfg__alert').textContent.indexOf('Invalid color') !== -1,
     q('.as-cfg__alert') ? q('.as-cfg__alert').textContent : 'no alert');
  ok('a validation failure is labelled', chip() === 'Not saved — validation error', chip());
  ok('a validation failure keeps the draft', bg() === '#zzzzzz', bg());
  set_bg('#112233');
  await wait(60);
  ok('editing clears the old error', q('.as-cfg__alert').hasAttribute('hidden'),
     q('.as-cfg__alert').textContent);
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('a successful preview after a failure clears the error', q('.as-cfg__alert').hasAttribute('hidden'),
     q('.as-cfg__alert').textContent);
  ok('the successful preview is staged', chip() === 'Staged for preview', chip());
  q('.as-cfg__actions [data-focus-key="discard"]').click();
  await wait(500);

  // ── 9. A network failure keeps the draft ───────────────────────────
  set_bg('#334455');
  await wait(60);
  window.__fail_next_put = true;
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('a network failure is reported', !!q('.as-cfg__alert') &&
     q('.as-cfg__alert').textContent.indexOf('preview could not be opened') !== -1,
     q('.as-cfg__alert') ? q('.as-cfg__alert').textContent : 'no alert');
  ok('a network failure keeps the draft', bg() === '#334455', bg());
  ok('a network failure is labelled as a connection error', chip() === 'Not saved — connection error', chip());
  q('.as-cfg__actions [data-focus-key="discard"]').click();
  await wait(500);
  ok('a transaction with nothing staged can still be discarded', !SERVER.tx,
     SERVER.tx ? SERVER.tx.id : 'none');

  // ── 11. Closing while a preview transaction exists ──────────────────
  set_bg('#778899');
  await wait(60);
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('a transaction is staged before closing', !!SERVER.tx && !!SERVER.staged, SERVER.tx ? SERVER.tx.id : 'none');
  var asked = 0;
  window.confirm = function () { asked += 1; return false; };
  q('.as-cfg__close').click();
  await wait(400);
  ok('closing a staged preview asks first', asked === 1, String(asked));
  ok('declining keeps the editor open', !!q('.as-cfg__rail') && q('#agentshell-config-panel').classList.contains('is-open'));
  ok('declining keeps the staged transaction', !!SERVER.tx, SERVER.tx ? SERVER.tx.id : 'none');
  window.confirm = function () { return true; };
  q('.as-cfg__close').click();
  await wait(600);
  ok('accepting discards the staged transaction', !SERVER.tx, SERVER.tx ? SERVER.tx.id : 'none');
  ok('accepting closes the editor', !q('#agentshell-config-panel').classList.contains('is-open'));
  ok('the committed configuration survived the staged close',
     SERVER.committed.config['--theme-bg'] === '#abcdef', SERVER.committed.config['--theme-bg']);

  report();
}

/**
 * A blocked pop-up must not masquerade as a failed save.
 *
 * The staging PUT succeeded, so the draft is staged and can be saved or
 * discarded; only the tab was blocked. The operator is told that, and the
 * status stays "Staged for preview".
 */
async function run_blocked() {
  q('.as-cfg__tab[data-context="appearance"]').click();
  await wait(80);
  var input = tokenInput('--theme-bg');
  input.value = '#123456';
  input.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(60);
  q('.as-cfg__actions [data-focus-key="preview"]').click();
  await wait(500);
  ok('a blocked tab is reported', !!q('.as-cfg__alert') &&
     q('.as-cfg__alert').textContent.indexOf('blocked the new tab') !== -1,
     q('.as-cfg__alert') ? q('.as-cfg__alert').textContent : 'no alert');
  ok('a blocked tab does not pretend the draft was not staged',

  // Explicit recovery: asked, confirmed, audited server-side, capability

  q('.as-cfg__actions [data-focus-key="takeover"]').click();
  await wait(600);
  ok('recovery asks first', asked === 1, String(asked));
  ok('recovery is sent to the server',
     window.__requests.join(' ').indexOf('/transaction/recover') !== -1, window.__requests.join(' '));
  ok('recovery restores the staged draft', tokenInput('--theme-bg').value === '#fafaf9' || chip() === 'Staged for preview',

     String(sessionStorage.getItem('agentshell.editor.session.v1')));

  // ── the choices ──────────────────────────────────────────────────────
  var options = qa('.as-cfg__picker-option');
  ok('the picker lists the components', options.length >= 4, String(options.length));
  ok('the choices are named, not numbered',
     options[0].textContent.indexOf('Site Title') !== -1 ||
     options[0].textContent.indexOf('Navigation') !== -1,
     options[0] ? options[0].textContent : 'none');
  ok('no choice is a bare number',
     !q('.as-cfg__picker-list').textContent.match(/(^|\s)\d+\.\s/),
     q('.as-cfg__picker-list').textContent.slice(0, 80));
  ok('the groups are named',
     q('.as-cfg__picker-list').textContent.indexOf('WordPress components') !== -1);
  ok('the insertion area is stated',
     q('.as-cfg__picker-target').textContent.indexOf('Adding to') !== -1,
     q('.as-cfg__picker-target').textContent);
  ok('the insertion area names the zone and the area',
     q('.as-cfg__picker-target').textContent.indexOf('Header') !== -1 &&
     q('.as-cfg__picker-target').textContent.indexOf('Middle Centre') !== -1,
     q('.as-cfg__picker-target').textContent);

  // ── the keyboard ─────────────────────────────────────────────────────
  ok('the focus is in the picker', q('.as-cfg__picker').contains(document.activeElement),
     document.activeElement ? document.activeElement.className : 'none');
  ok('the filter field has the focus',
     document.activeElement && document.activeElement.className.indexOf('as-cfg__picker-filter') !== -1,
     document.activeElement ? document.activeElement.className : 'none');

  var firstActive = q('.as-cfg__picker-option.is-active');
  ok('a choice is highlighted', !!firstActive);
  ok('the highlighted choice is announced',
     q('.as-cfg__picker-live').textContent.length > 0,
     q('.as-cfg__picker-live').textContent);

  // Arrow down moves the highlight.
  q('.as-cfg__picker-filter').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
  await wait(40);
  var secondActive = q('.as-cfg__picker-option.is-active');
  ok('the arrow keys move the highlight', !!secondActive && secondActive !== firstActive);
  ok('the highlight is marked for assistive technology',
     secondActive && secondActive.getAttribute('aria-selected') === 'true');
  ok('the filter points at the highlighted choice',
     q('.as-cfg__picker-filter').getAttribute('aria-activedescendant') === secondActive.id);

  // Escape dismisses it and puts the focus back.
  q('.as-cfg__picker-filter').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(60);
  ok('Escape dismisses the picker', !q('.as-cfg__picker'));
  ok('Escape adds nothing', qa('.as-cfg__block').length === blocksBefore,
     String(qa('.as-cfg__block').length - blocksBefore));
  ok('Escape does not dirty the draft', chip() === 'Saved', chip());
  ok('the focus goes back to where it came from',
     document.activeElement === addButton,
     document.activeElement ? document.activeElement.getAttribute('data-focus-key') : 'none');

  // ── the keyboard alone can make a choice ─────────────────────────────
  addButton.click();
  await wait(80);
  q('.as-cfg__picker-filter').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
  await wait(40);
  var toChoose = q('.as-cfg__picker-option.is-active');
  var chosenLabel = toChoose ? toChoose.textContent : '';
  q('.as-cfg__picker-filter').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await wait(80);
  ok('Enter chooses the highlighted component', !q('.as-cfg__picker'));
  ok('the chosen component was added', qa('.as-cfg__block').length === blocksBefore + 1,
     String(qa('.as-cfg__block').length - blocksBefore));
  ok('the chosen component is the one that was highlighted',
     qa('.as-cfg__block').slice(-1)[0].textContent.indexOf(chosenLabel.split('from')[0].trim()) !== -1,
     chosenLabel);
  ok('choosing a component dirties the draft', chip() === 'Unsaved changes', chip());

  // ── cancelling changes nothing ───────────────────────────────────────
  var blocksBeforeCancel = qa('.as-cfg__block').length;
  addButton.click();
  await wait(80);
  q('.as-cfg__picker [data-focus-key="picker-cancel"]').click();
  await wait(60);
  ok('cancelling closes the picker', !q('.as-cfg__picker'));
  ok('cancelling adds nothing', qa('.as-cfg__block').length === blocksBeforeCancel,
     String(qa('.as-cfg__block').length - blocksBeforeCancel));
  ok('cancelling leaves the draft as it was', chip() === 'Unsaved changes', chip());

  // ── the filter ───────────────────────────────────────────────────────
  addButton.click();
  await wait(80);
  var filter = q('.as-cfg__picker-filter');
  filter.value = 'logo';
  filter.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(60);
  var filtered = qa('.as-cfg__picker-option');
  ok('the filter narrows the choices', filtered.length === 1, String(filtered.length));
  ok('the filtered choice is the one that matched',
     filtered.length === 1 && filtered[0].textContent.indexOf('Site Logo') !== -1,
     filtered.length ? filtered[0].textContent : 'none');

  // A filter that matches nothing says so.
  filter.value = 'zzzznotathing';
  filter.dispatchEvent(new Event('input', { bubbles: true }));
  await wait(60);
  ok('a filter that matches nothing says so',
     !q('.as-cfg__picker-empty').hasAttribute('hidden') &&
     q('.as-cfg__picker-empty').textContent.indexOf('Nothing matches') !== -1,
     q('.as-cfg__picker-empty').textContent);

  // Enter with nothing to choose adds nothing.
  var blocksBeforeEmpty = qa('.as-cfg__block').length;
  filter.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await wait(60);
  ok('Enter with no match adds nothing', qa('.as-cfg__block').length === blocksBeforeEmpty);

  // ── discarding the picker's work ─────────────────────────────────────
  q('.as-cfg__picker-filter').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(60);
  q('.as-cfg__actions [data-focus-key="discard"]').click();
  await wait(150);
  ok('discarding removes what the picker added', qa('.as-cfg__block').length === blocksBefore,
     String(qa('.as-cfg__block').length - blocksBefore));
  ok('discarding returns the draft to saved', chip() === 'Saved', chip());

  report();
}

/**
 * Workflow F: an agent is holding the transaction.
 *
 * The editor must respect the ownership: it may show the state, it must say
 * who holds it, and it must not offer a save that would silently overwrite
 * somebody else's staged work.
 */
async function run_locked() {
  ok('the editor opens while another actor holds the transaction', !!q('.as-cfg__rail'));
  ok('the state names the actor that holds the transaction', chip().indexOf('agent') !== -1, chip());
  ok('the panel is marked as locked', q('#agentshell-config-panel').getAttribute('data-state') === 'locked',
     q('#agentshell-config-panel').getAttribute('data-state'));
  ok('saving is not offered', q('.as-cfg__actions [data-focus-key="save"]').hasAttribute('disabled'),
     q('.as-cfg__actions [data-focus-key="save"]').outerHTML.slice(0, 120));
  ok('the discard button is not offered either',
     q('.as-cfg__actions [data-focus-key="discard"]').hasAttribute('disabled'));

  // Even if something asks for a save, nothing is written. The call is
  // made through the app's own handle, because a disabled button fires no
  // click at all — the guard behind the button is what is being tested.
  window.AgentshellConfigurator.save();
  await wait(200);
  ok('a save attempt while locked writes nothing', window.__puts.length === 0, String(window.__puts.length));
  ok('a save attempt while locked says why',
     !!q('.as-cfg__alert') && q('.as-cfg__alert').textContent.indexOf('Another actor') !== -1,
     q('.as-cfg__alert') ? q('.as-cfg__alert').textContent : 'no alert');

  window.__requests.length = 0;
  window.__opened.length = 0;
  window.AgentshellConfigurator.preview();
  await wait(200);
  ok('a preview attempt while locked writes nothing', window.__puts.length === 0, String(window.__puts.length));
  ok('a preview attempt while locked does not mint a credential',
     window.__requests.join( ' ' ).indexOf( '/transaction/preview' ) === -1,
     window.__requests.join( ' ' ));
  ok('a preview attempt while locked opens no tab', window.__opened.length === 0, String(window.__opened.length));
  ok('a preview attempt while locked says why',
     !!q('.as-cfg__alert') && q('.as-cfg__alert').textContent.indexOf('Another actor') !== -1,
     q('.as-cfg__alert') ? q('.as-cfg__alert').textContent : 'no alert');

  // The rest of the editor still works for reading.
  ok('the areas are still shown', qa('button.as-cfg__area').length === 9, String(qa('button.as-cfg__area').length));

  // The picker is a local edit: it changes the draft, never the server.
  // While another actor holds the transaction the draft cannot be saved,
  // so the picker may still be used — but nothing reaches the server.
  var addButton = q('[data-focus-key^="add:"]');
  ok('the area still offers a way to add a component', !!addButton);
  addButton.click();
  await wait(80);
  ok('the picker opens while another actor holds the transaction', !!q('.as-cfg__picker'));
  var blocksBefore = qa('.as-cfg__block').length;
  q('.as-cfg__picker-option').click();
  await wait(80);
  ok('a choice changes the draft', qa('.as-cfg__block').length === blocksBefore + 1,
     String(qa('.as-cfg__block').length - blocksBefore));
  ok('a choice while locked writes nothing to the server', window.__puts.length === 0,
     String(window.__puts.length));
  ok('saving is still refused while another actor holds the transaction',
     q('.as-cfg__actions [data-focus-key="save"]').hasAttribute('disabled'));

  report();
}

run().catch(function (e) {
  document.title = JSON.stringify({ harness_error: String(e && e.message ? e.message : e), stack: e && e.stack, errors: window.__errors });
});
</script>
</body></html>
